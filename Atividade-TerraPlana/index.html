<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terra Plana - Three.js</title>
  </head>
  <body>
    <div id="ui-modelo" style="position:fixed;top:12px;left:12px;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 12px;background:rgba(8,12,24,0.7);border:1px solid rgba(180,200,255,0.25);border-radius:10px;color:#e8eeff;font-family:Segoe UI,Tahoma,sans-serif;backdrop-filter:blur(4px);">
      <label for="sceneSelect">Modelo:</label>
      <select id="sceneSelect" style="background:#0f1830;color:#f1f4ff;border:1px solid #4e5e8f;border-radius:6px;padding:4px 6px;">
        <option value="flatEarth">FlatEarth</option>
        <option value="earth">Earth</option>
      </select>
      <button id="aplicarModelo" style="background:#2d5fff;color:white;border:none;border-radius:6px;padding:5px 10px;cursor:pointer;">Aplicar</button>
    </div>

    <div id="info">Modelo · Three.js</div>

    <script type="module" src="/src/sceneSelector.js"></script>
  </body>
</html>
