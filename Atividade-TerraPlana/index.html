<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terra Plana - Three.js</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { overflow:hidden; background:#000; }
canvas { display:block; }
#info {
  position:absolute; top:16px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,0.6); font-family:monospace; font-size:13px;
}
</style>
</head>
<body>
<div id="info">Modelo Terra Plana · Three.js</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040d);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 7, 22);
camera.lookAt(0,1,0);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Estrelas
const sg = new THREE.BufferGeometry();
const sp = new Float32Array(4000*3);
for(let i=0;i<sp.length;i++) sp[i]=(Math.random()-0.5)*600;
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.3})));

scene.add(new THREE.AmbientLight(0x111a2e,1.5));

// ── TEXTURA DA TERRA ──────────────────────────────────────────────────────────
// Coordenadas normalizadas (0..1) relativas ao canvas quadrado.
// O disco ocupa todo o canvas; o centro do disco = (0.5, 0.5).
// A projeção é uma vista de cima (polar), então:
//   - centro (0.5,0.5) = Polo Norte / Ártico
//   - borda = "muralha de gelo" (Antártica no mito flat-earth)
//   - Américas: quadrante esquerdo
//   - Europa/África: quadrante superior-direito/direito
//   - Ásia/Oceania: quadrante direito/inferior-direito

const S = 2048;
const cv = document.createElement('canvas');
cv.width = cv.height = S;
const ctx = cv.getContext('2d');

// Clip circular — garante que nada vaze para fora do disco
ctx.save();
ctx.beginPath();
ctx.arc(S/2,S/2,S/2-1,0,Math.PI*2);
ctx.clip();

// Oceano
const og = ctx.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
og.addColorStop(0,'#3a9ad9');
og.addColorStop(0.6,'#1a6fa8');
og.addColorStop(1,'#0a3355');
ctx.fillStyle=og; ctx.fillRect(0,0,S,S);

// Helper: desenha um continente como polígono com vértices normalizados
function land(pts, color='#4e9e3a') {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0][0]*S, pts[0][1]*S);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]*S,pts[i][1]*S);
  ctx.closePath();
  ctx.fill();
}

// Helper: elipse simples
function eland(cx2,cy2,rx,ry,rot,color='#4e9e3a'){
  ctx.fillStyle=color;
  ctx.save(); ctx.translate(cx2*S,cy2*S); ctx.rotate(rot||0);
  ctx.beginPath(); ctx.ellipse(0,0,rx*S,ry*S,0,0,Math.PI*2);
  ctx.fill(); ctx.restore();
}

// ── GROENLÂNDIA (perto do centro = polo norte) ──
eland(0.43, 0.30, 0.038, 0.055, -0.3, '#c8e8d0');

// ── AMÉRICA DO NORTE ──
land([
  [0.16,0.30],[0.20,0.24],[0.26,0.20],[0.32,0.20],[0.37,0.23],
  [0.40,0.28],[0.40,0.34],[0.37,0.40],[0.34,0.45],[0.30,0.48],
  [0.25,0.50],[0.20,0.47],[0.16,0.41],[0.14,0.35]
]);
// Flórida
eland(0.28, 0.50, 0.018, 0.030, 0.15);
// Alasca
eland(0.13, 0.26, 0.038, 0.028, 0.3);

// ── AMÉRICA CENTRAL ──
land([
  [0.28,0.50],[0.32,0.49],[0.34,0.52],[0.32,0.56],[0.29,0.55],[0.27,0.52]
]);

// ── AMERICA DO SUL ──
land([
  [0.26,0.55],[0.31,0.53],[0.36,0.55],[0.39,0.61],
  [0.39,0.68],[0.36,0.74],[0.31,0.77],[0.27,0.74],
  [0.24,0.68],[0.23,0.61],[0.24,0.57]
]);

// ── ISLÂNDIA ──
eland(0.47, 0.26, 0.022, 0.016, 0.2, '#6ab86a');

// ── EUROPA ──
land([
  [0.49,0.23],[0.53,0.20],[0.58,0.20],[0.61,0.23],
  [0.62,0.27],[0.60,0.31],[0.57,0.33],[0.53,0.33],
  [0.50,0.30],[0.48,0.27]
]);
// Península Ibérica
land([[0.48,0.30],[0.52,0.29],[0.53,0.34],[0.50,0.36],[0.47,0.34],[0.47,0.31]]);
// Itália
land([[0.54,0.32],[0.56,0.31],[0.57,0.36],[0.55,0.39],[0.53,0.36]]);
// Escandinávia
land([[0.52,0.18],[0.55,0.15],[0.58,0.16],[0.58,0.21],[0.55,0.23],[0.52,0.21]]);
// Balcãs / Anatólia
land([[0.58,0.28],[0.63,0.27],[0.66,0.30],[0.65,0.34],[0.60,0.34],[0.57,0.31]]);

// ── AFRICA ──
land([
  [0.49,0.34],[0.55,0.32],[0.61,0.33],[0.65,0.37],
  [0.67,0.44],[0.66,0.52],[0.63,0.59],[0.59,0.65],
  [0.54,0.67],[0.49,0.65],[0.46,0.59],[0.45,0.51],
  [0.46,0.43],[0.47,0.37]
]);
// Madagáscar
eland(0.65, 0.62, 0.014, 0.030, 0.2);

// ── ÁSIA (bloco principal) ──
land([
  [0.60,0.21],[0.66,0.18],[0.73,0.16],[0.79,0.17],
  [0.83,0.20],[0.85,0.25],[0.84,0.31],[0.81,0.36],
  [0.76,0.38],[0.70,0.39],[0.64,0.36],[0.60,0.31],
  [0.58,0.26]
]);
// Sibéria extra norte
land([[0.66,0.18],[0.72,0.14],[0.78,0.14],[0.82,0.17],[0.79,0.17]]);
// Península Arábica
land([[0.62,0.35],[0.67,0.34],[0.69,0.40],[0.66,0.45],[0.62,0.43],[0.60,0.38]]);
// Subcontinente Indiano
land([[0.67,0.38],[0.73,0.37],[0.75,0.43],[0.72,0.50],[0.67,0.48],[0.65,0.43]]);
// Indochina / Sudeste Asiático
land([[0.76,0.38],[0.81,0.36],[0.83,0.41],[0.80,0.46],[0.76,0.45],[0.74,0.41]]);
// Coreia / Japão
eland(0.84, 0.27, 0.012, 0.030, -0.3);
eland(0.86, 0.30, 0.010, 0.022, -0.2);
// Sri Lanka
eland(0.71, 0.51, 0.009, 0.012, 0);
// Filipinas / ilhas
eland(0.81, 0.45, 0.012, 0.025, 0.3);

// ── OCEANIA ──
land([
  [0.76,0.60],[0.83,0.57],[0.87,0.58],[0.88,0.64],
  [0.85,0.69],[0.79,0.70],[0.75,0.66],[0.74,0.62]
]);
// Tasmânia
eland(0.82, 0.71, 0.012, 0.014, 0);
// Nova Zelândia (ilha norte)
eland(0.90, 0.66, 0.012, 0.022, -0.3);
// Nova Zelândia (ilha sul)
eland(0.89, 0.70, 0.010, 0.018, -0.2);
// Nova Guiné
eland(0.79, 0.55, 0.030, 0.016, 0.4);

// ── ANEL DE GELO DA BORDA (Antártica) ── SEM ponto branco central
const iceRing = ctx.createRadialGradient(S/2,S/2,S*0.40,S/2,S/2,S/2);
iceRing.addColorStop(0,'rgba(210,235,255,0)');
iceRing.addColorStop(0.70,'rgba(210,235,255,0.0)');
iceRing.addColorStop(0.85,'rgba(220,240,255,0.5)');
iceRing.addColorStop(0.95,'rgba(240,250,255,0.88)');
iceRing.addColorStop(1,'rgba(255,255,255,1)');
ctx.fillStyle=iceRing;
ctx.beginPath(); ctx.arc(S/2,S/2,S/2-1,0,Math.PI*2); ctx.fill();

ctx.restore(); // fim do clip circular

const earthTex = new THREE.CanvasTexture(cv);

// ── DISCO ──
const R = 9;
const earth = new THREE.Mesh(
  new THREE.CircleGeometry(R,128),
  new THREE.MeshLambertMaterial({ map:earthTex, side:THREE.DoubleSide })
);
earth.rotation.x = -Math.PI/2;
earth.receiveShadow = true;
scene.add(earth);

// Borda lateral
const rim = new THREE.Mesh(
  new THREE.CylinderGeometry(R,R,0.6,128,1,true),
  new THREE.MeshStandardMaterial({color:0x0a1f33,roughness:0.7,metalness:0.2})
);
rim.position.y=-0.3; scene.add(rim);

// Glow borda
const glowMesh = new THREE.Mesh(
  new THREE.RingGeometry(R*0.98,R*1.08,128),
  new THREE.MeshBasicMaterial({color:0x4fc3f7,transparent:true,opacity:0.15,side:THREE.DoubleSide})
);
glowMesh.rotation.x=-Math.PI/2; glowMesh.position.y=0.01; scene.add(glowMesh);

// Face inferior
const bot = new THREE.Mesh(
  new THREE.CircleGeometry(R,128),
  new THREE.MeshBasicMaterial({color:0x081c2c})
);
bot.rotation.x=Math.PI/2; bot.position.y=-0.6; scene.add(bot);

// ── SOL ──
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(1.2,64,64),
  new THREE.MeshBasicMaterial({color:0xffee88})
);
scene.add(sun);

// Halos em camadas (do mais quente ao mais difuso)
[
  {r:1.8, c:0xffcc44, o:0.40},
  {r:2.8, c:0xff9900, o:0.20},
  {r:4.2, c:0xff6600, o:0.09},
  {r:6.0, c:0xff3300, o:0.04},
].forEach(h=>{
  sun.add(new THREE.Mesh(
    new THREE.SphereGeometry(h.r,32,32),
    new THREE.MeshBasicMaterial({color:h.c,transparent:true,opacity:h.o,depthWrite:false})
  ));
});

// Luz principal (ilumina a Terra)
const sunLight = new THREE.PointLight(0xffe8aa,4.5,130);
sunLight.castShadow=true;
sun.add(sunLight);

// Luz secundária suave para preencher sombras
const sunFill = new THREE.PointLight(0xffddaa,1.0,70);
sunFill.position.set(1,-1,1);
sun.add(sunFill);

// ── LUA ──
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(0.6,32,32),
  new THREE.MeshLambertMaterial({color:0xbbbbcc})
);
scene.add(moon);
moon.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.0,32,32),
  new THREE.MeshBasicMaterial({color:0xdde0ff,transparent:true,opacity:0.10,depthWrite:false})
));
moon.add(new THREE.PointLight(0xaabbff,0.3,25));

// ── ANIMAÇÃO ──
const ORBIT_RADIUS=14, HEIGHT=6;
let t=0;

function animate(){
  requestAnimationFrame(animate);
  t+=0.004;
  earth.rotation.z+=0.0002;

  sun.position.set(ORBIT_RADIUS*Math.cos(t), HEIGHT, ORBIT_RADIUS*Math.sin(t));
  moon.position.set(ORBIT_RADIUS*Math.cos(t+Math.PI), HEIGHT, ORBIT_RADIUS*Math.sin(t+Math.PI));

  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
